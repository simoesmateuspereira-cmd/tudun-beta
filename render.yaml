# Referência de homologação. Revisar planos e custos antes de aplicar no Render.
# Nenhum segredo ou valor de produção está armazenado neste arquivo.
services:
  - type: web
    name: tudun-homologacao
    runtime: docker
    region: virginia
    plan: 0.5c-512mb
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python scripts/production.py --serve-only
    preDeployCommand: python scripts/production.py --release-only
    healthCheckPath: /saude/
    autoDeployTrigger: "off"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: tudun-postgres-homologacao
          property: connectionString
      - key: DATABASE_TIME_ZONE
        value: UTC
      - key: DATABASE_CONN_MAX_AGE
        value: "60"
      - key: CACHE_URL
        fromService:
          type: keyvalue
          name: tudun-redis-homologacao
          property: connectionString
      - key: CACHE_KEY_PREFIX
        value: tudun-homologacao
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: tudun-homologacao
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DJANGO_TRUST_PROXY_SSL
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "300"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "False"
      - key: SECURE_HSTS_PRELOAD
        value: "False"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_USE_SSL
        value: "False"
      - key: EMAIL_TIMEOUT
        value: "10"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: LOG_TO_FILE
        value: "False"

  - type: keyvalue
    name: tudun-redis-homologacao
    region: virginia
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: tudun-postgres-homologacao
    region: virginia
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    databaseName: tudun
    user: tudun
    ipAllowList: []

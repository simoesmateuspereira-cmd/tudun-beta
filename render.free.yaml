# Homologação gratuita: Render web + Neon PostgreSQL + Upstash Redis + Gmail API HTTPS.
# Selecione este arquivo como Blueprint durante a criação no Render.
# Nenhum segredo ou valor externo está armazenado neste arquivo.
services:
  - type: web
    name: tudun-homologacao
    runtime: docker
    region: virginia
    plan: free
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # O plano Free não oferece preDeployCommand. Com uma única instância,
    # a inicialização executa migrações, arquivos estáticos e depois o Waitress.
    dockerCommand: python scripts/production.py
    healthCheckPath: /saude/
    autoDeployTrigger: "off"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSLMODE
        value: require
      - key: DATABASE_TIME_ZONE
        value: UTC
      - key: DATABASE_CONN_MAX_AGE
        value: "0"
      - key: CACHE_URL
        sync: false
      - key: CACHE_KEY_PREFIX
        value: tudun-homologacao
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: tudun-homologacao
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DJANGO_TRUST_PROXY_SSL
        value: "True"
      - key: DJANGO_FORCE_HTTPS_SCHEME
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "300"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "False"
      - key: SECURE_HSTS_PRELOAD
        value: "False"
      # HTTPS evita as portas SMTP bloqueadas no Render Free.
      - key: EMAIL_BACKEND
        value: identity.gmail_backend.GmailAPIBackend
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: EMAIL_TIMEOUT
        value: "10"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: LOG_TO_FILE
        value: "False"
